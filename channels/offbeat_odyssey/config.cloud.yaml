video_count: 6
video_mode: "stock_footage"
skip_quality_checks: true
schedule_same_day: true

channel:
  theme: >
    This channel explores the world's most unusual, surprising, and off-the-beaten-path
    destinations. Each video deep-dives into a single bizarre or stunning place —
    underground cities, pink lakes, towns with no roads, islands frozen in time. The tone
    is curious, energetic, and conversational — like a well-traveled friend telling you
    about the wildest place they've ever been. Videos combine beautiful stock footage
    with engaging narration that makes viewers feel like they're discovering these
    places for the first time.
  required_keywords:
    - unusual
    - hidden
    - stunning
    - bizarre
    - secret
  disclaimer: >
    This video is for entertainment and educational purposes only. Travel conditions,
    regulations, and accessibility may change. Always research current conditions and
    obtain necessary permits before visiting any destination mentioned in this video.

script:
  min_words: 1400
  max_words: 1700
  banned_phrases:
    - "subscribe to my channel"
    - "like and subscribe"
    - "hit the bell"
    - "smash that like button"

text_model:
  name: "gemini-3-flash-preview"
  temperature: 0.9
  max_output_tokens: 16384

tts:
  model: "gemini-2.5-flash-preview-tts"
  voice: "Orus"

image_gen:
  model: "gemini-2.5-flash-image"
  seconds_per_image: 9
  image_width: 1920
  image_height: 1080
  aspect_ratio: "16:9"

stock_footage:
  seconds_per_clip: 8

subtitles:
  font_size: 28
  margin_v: 50

thumbnail:
  model: "gemini-2.5-flash-image"
  width: 1280
  height: 720
  min_contrast_ratio: 3.0
  text_overlay: true
  fixed_image_prompt: "Stunning wide-angle landscape photograph of an exotic remote destination with dramatic lighting, vivid colors, golden hour, cinematic composition. No text in image."
  portrait_width: 620
  background_style: "bokeh"
  story_badge: false

video:
  fps: 24
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "8000k"

youtube:
  client_secrets_file: "client_secrets.json"
  token_file: "youtube_token_offbeat.json"
  category_id: "19"
  default_language: "en"
  privacy_status: "private"
  tags:
    - travel
    - offbeat travel
    - unusual places
    - hidden places
    - bizarre destinations
    - places you won't believe exist
    - unique travel
    - bucket list
    - must see places
    - amazing places
    - incredible places
    - strangest places on earth
    - beautiful places
    - travel destinations
    - world travel

retry:
  max_attempts: 3
  base_delay_seconds: 2
  max_delay_seconds: 60

scheduling:
  timezone: "America/New_York"
  publish_times:
    - [8, 0]    # 8:00 AM ET
    - [11, 0]   # 11:00 AM ET
    - [14, 0]   # 2:00 PM ET
    - [17, 0]   # 5:00 PM ET
    - [20, 0]   # 8:00 PM ET
    - [22, 0]   # 10:00 PM ET

max_parallel_videos: 6
render_workers: 20
cleanup_after_upload: true

output:
  base_dir: "output"
