video_count: 1
video_mode: "stock_footage"
skip_quality_checks: true

channel:
  theme: >
    This channel makes Top 10 travel list videos about stunning US destinations —
    national parks, charming small towns, historic cities, hidden gems, and must-do
    experiences. Each video counts down the best things to see, do, or visit at a
    specific destination. The tone is enthusiastic, conversational, and informative —
    like an excited friend who just got back from an incredible trip. Videos combine
    beautiful stock footage with engaging narration that highlights what makes each
    spot special, including practical tips and surprising facts.
  required_keywords:
    - travel
    - things to do
    - travel guide
    - best places to visit
    - hidden gems
  disclaimer: >
    This video is for entertainment and educational purposes only. Travel conditions,
    regulations, and accessibility may change. Always research current conditions and
    obtain necessary permits before visiting any destination mentioned in this video.

script:
  min_words: 1400
  max_words: 1700
  banned_phrases:
    - "subscribe to my channel"
    - "like and subscribe"
    - "hit the bell"
    - "smash that like button"

text_model:
  name: "gemini-3-flash-preview"
  temperature: 0.9
  max_output_tokens: 16384

tts:
  model: "gemini-2.5-flash-preview-tts"
  voice: "Orus"

image_gen:
  model: "gemini-2.5-flash-image"
  seconds_per_image: 9
  image_width: 1920
  image_height: 1080
  aspect_ratio: "16:9"

stock_footage:
  seconds_per_clip: 8

subtitles:
  font_size: 28
  margin_v: 50

thumbnail:
  model: "gemini-2.5-flash-image"
  width: 1280
  height: 720
  min_contrast_ratio: 3.0
  text_overlay: true
  fixed_image_prompt: "Stunning wide-angle landscape photograph of an exotic remote destination with dramatic lighting, vivid colors, golden hour, cinematic composition. No text in image."
  portrait_width: 620
  background_style: "bokeh"
  story_badge: false

video:
  fps: 24
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "8000k"

youtube:
  client_secrets_file: "client_secrets.json"
  token_file: "youtube_token_offbeat.json"
  category_id: "19"
  default_language: "en"
  privacy_status: "private"
  tags:
    - travel
    - things to do
    - travel guide
    - best places to visit
    - hidden gems
    - USA travel
    - national parks
    - bucket list
    - top 10
    - must visit

retry:
  max_attempts: 3
  base_delay_seconds: 2
  max_delay_seconds: 60

scheduling:
  timezone: "America/New_York"
  publish_times:
    - [10, 0]   # 10:00 AM ET
    - [18, 0]   # 6:00 PM ET

max_parallel_videos: 1
cleanup_after_upload: false

output:
  base_dir: "output"
