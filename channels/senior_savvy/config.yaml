video_count: 1
video_mode: "stock_footage"

channel:
  theme: >
    This channel creates informative health and wellness videos for adults over 50.
    Topics include healing herbs, medicinal plants, longevity foods, natural remedies,
    anti-aging nutrition, brain health, gut health, and ancient healing wisdom backed
    by modern science. Videos use a calm, authoritative, and encouraging tone — like
    a knowledgeable friend sharing practical health advice. Content is educational,
    evidence-informed, and empowering — never fear-based or preachy.
  required_keywords:
    - senior health
    - natural remedies
    - healing herbs
    - longevity
    - anti-aging
    - over 50
  disclaimer: >
    This video is for educational and informational purposes only and is not intended
    as medical advice. Always consult a qualified healthcare professional before making
    changes to your diet, supplement routine, or health regimen. Individual results may vary.

script:
  min_words: 3500
  max_words: 4500
  banned_phrases:
    - "subscribe to my channel"
    - "like and subscribe"
    - "hit the bell"
    - "smash that like button"
    - "guys"

text_model:
  name: "gemini-3-flash-preview"
  temperature: 0.9
  max_output_tokens: 16384

tts:
  model: "gemini-2.5-flash-preview-tts"
  voice: "Orus"

image_gen:
  model: "gemini-2.5-flash-image"
  seconds_per_image: 9
  image_width: 1920
  image_height: 1080
  aspect_ratio: "16:9"

stock_footage:
  seconds_per_clip: 10

subtitles:
  font_size: 32
  margin_v: 50

thumbnail:
  model: "gemini-2.5-flash-image"
  width: 1280
  height: 720
  min_contrast_ratio: 3.0
  text_overlay: true
  fixed_image_prompt: "A vibrant collection of fresh healing herbs and medicinal plants arranged beautifully on a rustic wooden table with warm natural lighting. No text in image."

video:
  fps: 24
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "8000k"

youtube:
  client_secrets_file: "client_secrets.json"
  token_file: "youtube_token_senior.json"
  category_id: "26"
  default_language: "en"
  privacy_status: "private"
  tags:
    - senior health
    - healing herbs
    - natural remedies
    - medicinal plants
    - longevity foods
    - anti-aging foods
    - over 50 health
    - herbal medicine

retry:
  max_attempts: 3
  base_delay_seconds: 2
  max_delay_seconds: 60

scheduling:
  timezone: "America/New_York"
  publish_times:
    - [8, 0]    # 8:00 AM ET
    - [18, 0]   # 6:00 PM ET

max_parallel_videos: 1
cleanup_after_upload: false

output:
  base_dir: "output"
