video_count: 5
video_mode: "slideshow"

channel:
  theme: >
    This channel creates encyclopedia-style catalog videos covering every
    military vehicle and weapon ever made by a specific country, manufacturer,
    or used in a specific war. Each video systematically goes through 50-60
    items (tanks, fighter jets, rifles, submarines, pistols, etc.), showing
    a clean studio-style image of each item with its name and release date,
    while the narrator provides key specs, history, and real-world performance.
    The format is similar to "Every Soviet Submarine Ever Built" or
    "Every SIG Sauer Weapon Ever Made."
  required_keywords:
    - military
    - weapons
    - tanks
    - military vehicles
    - guns
    - firearms
    - military history
  disclaimer: >
    This video is for educational and entertainment purposes only. Information
    about military equipment is based on publicly available sources and may
    contain inaccuracies. Some visuals are AI-generated illustrative
    reconstructions. We are not affiliated with any military organization
    or weapons manufacturer.

script:
  min_words: 4500
  max_words: 5000
  banned_phrases:
    - "subscribe to my channel"
    - "like and subscribe"
    - "hit the bell"
    - "smash that like button"
    - "in this video"
    - "hey guys"
    - "what's up guys"
    - "without further ado"
    - "let's dive in"
    - "buckle up"

text_model:
  name: "gemini-3-flash-preview"
  temperature: 0.9
  max_output_tokens: 16384

tts:
  model: "gemini-2.5-flash-preview-tts"
  voice: "Schedar"

image_gen:
  model: "gemini-2.5-flash-image"
  reference_image: "channels/rank_recon/assets/gun_reference.png"
  reference_image_alt: "channels/rank_recon/assets/vehicle_reference.png"
  seconds_per_image: 30
  image_width: 1920
  image_height: 1080
  aspect_ratio: "16:9"

thumbnail:
  model: "gemini-3.1-flash-image-preview"
  width: 1280
  height: 720
  min_contrast_ratio: 4.5

video:
  fps: 24
  ken_burns_ratio: 0.0
  codec: "libx264"
  audio_codec: "aac"
  bitrate: "8000k"

youtube:
  client_secrets_file: "client_secrets.json"
  token_file: "youtube_token_ranks.json"
  category_id: "27"
  privacy_status: "private"
  tags:
    - military vehicles
    - military weapons
    - tanks
    - fighter jets
    - guns
    - firearms
    - military history
    - weapons explained
    - every weapon ever made
    - military equipment

retry:
  max_attempts: 3
  base_delay_seconds: 2
  max_delay_seconds: 60

scheduling:
  timezone: "America/New_York"
  publish_times:
    - [8, 0]
    - [18, 0]

max_parallel_videos: 1
cleanup_after_upload: false

output:
  base_dir: "output"
